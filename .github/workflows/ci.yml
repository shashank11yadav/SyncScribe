name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: syncscribe
          POSTGRES_PASSWORD: syncscribe
          POSTGRES_DB: syncscribe
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U syncscribe -d syncscribe"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    # Throwaway values for CI only. None of these are real credentials.
    env:
      DATABASE_URL: postgres://syncscribe:syncscribe@localhost:5433/syncscribe
      TEST_DATABASE_URL: postgres://syncscribe:syncscribe@localhost:5433/syncscribe_test
      AUTH_SECRET: ci-only-auth-secret-value-not-used-elsewhere
      AUTH_GITHUB_ID: ci-placeholder
      AUTH_GITHUB_SECRET: ci-placeholder
      AUTH_TRUST_HOST: "true"
      SYNC_TOKEN_SECRET: ci-only-sync-token-secret-0123456789abcdef
      NEXT_PUBLIC_SYNC_URL: ws://localhost:5201
      ALLOWED_ORIGINS: http://localhost:5200
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npm run db:migrate

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: apps/web
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
