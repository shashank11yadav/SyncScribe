version: 2
updates:
  - package-ecosystem: npm
    # typescript-eslint supports TypeScript < 6.1, so hold TypeScript majors until it catches up.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # CI and Pages run Node 24, so keep the Node type definitions on the same major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # codeql-action init and analyze must stay on the same version, so update actions together.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/sync
    schedule:
      interval: weekly
